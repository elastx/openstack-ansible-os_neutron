---

- name: Configure elx-netbilling service
  config_template:
    src: "elx_netbilling_agent.service.j2"
    dest: "/etc/systemd/system/elx_netbilling_agent.service"
    owner: "root"
    group: "root"
    mode: "0640"
  notify: Restart netbilling service
  tags:
    - elx-netbilling

- name: Retrieve URL for latest repo release
  shell:
    cmd: |
      'curl -L 
      -H "Accept: application/vnd.github+json" 
      -H "Authorization: Bearer {{ elx_github_token }}" 
      -H "X-GitHub-Api-Version: 2022-11-28" 
      https://api.github.com/repos/elastx/elx-netbilling-agent/releases/latest'
  register: elx_netbilling_url
  tags:
    - elx-netbilling

- name: Download agent release
  shell:
    cmd: |
      'curl -L 
      -H "Accept: application/vnd.github+json" 
      -H "Authorization: Bearer {{ elx_github_token }}" 
      -H "X-GitHub-Api-Version: 2022-11-28" 
      {{ elx_netbilling_url.assets_url }} > /usr/local/bin/elx-netbilling-agent'
  tags:
    - elx-netbilling
